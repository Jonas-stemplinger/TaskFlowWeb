<body>
    <div class="login-box">
        <h2>Register</h2>

        <form (ngSubmit)="register()">
            <input id="username" type="text" name="name" [(ngModel)]="name" placeholder="Username" required>
            <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="E-Mail-Adresse" autocomplete="email" required>

            <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Passwort" autocomplete="current-password" required>
            <input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Passwort bestätigen" autocomplete="current-password" required>

            <button type="submit">Registrieren</button>
        </form>

        <p>schon einen Account? <a href="/login">Anmelden</a></p>
    </div>

    @if (errorMessage) {
    <div class="error-message-container" style="border: white 2px solid;">
        <p style="color: whitesmoke; font-size: 32px;">
            {{ errorMessage }}
        </p>
    </div>
    }
</body>
